[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidbridge-rp"
version = "0.1.0"
description = "Minimal, unofficial Smart-ID RP API v3 client (authentication) from the eidbridge project"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Security"]

[project.urls]
Source = "https://github.com/tomkabel/eidbridge"

[tool.setuptools]
packages = ["eidbridge_rp"]

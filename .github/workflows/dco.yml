name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: check Signed-off-by trailers
        run: |
          bad=""
          for c in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            t="$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c")"
            if [ -z "$t" ]; then bad="$bad $c"; fi
          done
          if [ -n "$bad" ]; then
            echo "Commits missing a Signed-off-by trailer:"
            for c in $bad; do git log -1 --format='%H %s' "$c"; done
            exit 1
          fi
          echo "all commits signed off"
